{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Community Treasury & Mock Bank Accounts</h2>
    
    <!-- Overall Balance Card -->
    <div class="card my-4 p-3 bg-light">
        <h4>Total Treasury Balance</h4>
        <h2 id="total-balance" class="text-success">€0.00</h2>
    </div>

    <!-- Mock Bank Accounts Section -->
    <div class="row my-4">
        <div class="col-md-12">
            <h3>Connected Accounts</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Account Name</th>
                        <th>Account Number</th>
                        <th>Currency</th>
                        <th>Balance</th>
                    </tr>
                </thead>
                <tbody id="accounts-table-body">
                    <!-- Populated dynamically via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Transaction Logs Section -->
    <div class="row my-4">
        <div class="col-md-12">
            <h3>Recent Transactions</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Recorded By</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="logs-table-body">
                    <!-- Populated dynamically via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const logsBody = document.getElementById('logs-table-body');
    const accountsBody = document.getElementById('accounts-table-body');
    const formatEuro = amount => new Intl.NumberFormat('en-IE', {
        style: 'currency',
        currency: 'EUR'
    }).format(Number(amount));

    fetch('/api/treasury/ledger')
        .then(response => {
            if (!response.ok) throw new Error('Could not load treasury transactions.');
            return response.json();
        })
        .then(data => {
            logsBody.innerHTML = '';
            document.getElementById('total-balance').textContent = formatEuro(data.balance);

            if (!data.logs.length) {
                logsBody.innerHTML = '<tr><td colspan="5">No treasury transactions recorded yet.</td></tr>';
                return;
            }

            data.logs.forEach(log => {
                const row = document.createElement('tr');
                const values = [
                    log.created_at,
                    log.logged_by,
                    log.transaction_type,
                    `${log.transaction_type === 'contribution' ? '+' : '-'}${formatEuro(log.amount)}`,
                    log.description || ''
                ];
                values.forEach((value, index) => {
                    const cell = document.createElement('td');
                    cell.textContent = value;
                    if (index === 2) cell.classList.add('text-capitalize');
                    if (index === 3) {
                        cell.classList.add(log.transaction_type === 'contribution' ? 'text-success' : 'text-danger');
                    }
                    row.appendChild(cell);
                });
                logsBody.appendChild(row);
            });
        })
        .catch(error => {
            logsBody.innerHTML = `<tr><td colspan="5">${error.message}</td></tr>`;
        });

    fetch('/api/treasury/accounts')
        .then(response => {
            if (!response.ok) throw new Error('Could not load mock bank accounts.');
            return response.json();
        })
        .then(data => {
            accountsBody.innerHTML = '';
            if (!data.accounts.length) {
                accountsBody.innerHTML = '<tr><td colspan="4">No mock bank accounts connected.</td></tr>';
                return;
            }

            data.accounts.forEach(account => {
                const row = document.createElement('tr');
                [account.account_name, account.account_number, account.currency,
                    `${account.currency} ${Number(account.balance).toFixed(2)}`]
                    .forEach(value => {
                        const cell = document.createElement('td');
                        cell.textContent = value;
                        row.appendChild(cell);
                    });
                accountsBody.appendChild(row);
            });
        })
        .catch(error => {
            accountsBody.innerHTML = `<tr><td colspan="4">${error.message}</td></tr>`;
        });
});
</script>
{% endblock %}
