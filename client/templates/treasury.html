{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Community Treasury & Mock Bank Accounts</h2>
    
    <!-- Overall Balance Card -->
    <div class="card my-4 p-3 bg-light">
        <h4>Total Treasury Balance</h4>
        <h2 id="total-balance" class="text-success">$0.00</h2>
    </div>

    <!-- Mock Bank Accounts Section -->
    <div class="row my-4">
        <div class="col-md-12">
            <h3>Connected Accounts</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Account Name</th>
                        <th>Account Number</th>
                        <th>Currency</th>
                        <th>Balance</th>
                    </tr>
                </thead>
                <tbody id="accounts-table-body">
                    <!-- Populated dynamically via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Transaction Logs Section -->
    <div class="row my-4">
        <div class="col-md-12">
            <h3>Recent Transactions</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Account</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="logs-table-body">
                    <!-- Populated dynamically via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    fetch('/api/treasury')
        .then(response => response.json())
        .then(data => {
            // Set total balance
            document.getElementById('total-balance').textContent = `$${parseFloat(data.balance).toFixed(2)}`;

            // Populate transaction logs
            const logsBody = document.getElementById('logs-table-body');
            logsBody.innerHTML = '';
            data.logs.forEach(log => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${log.created_at}</td>
                    <td>${log.account_name} (${log.account_number})</td>
                    <td class="text-capitalize">${log.transaction_type}</td>
                    <td class="${log.transaction_type === 'deposit' ? 'text-success' : 'text-danger'}">
                        ${log.transaction_type === 'deposit' ? '+' : '-'}$${parseFloat(log.amount).toFixed(2)}
                    </td>
                    <td>${log.description || ''}</td>
                `;
                logsBody.appendChild(row);
            });
        });

    fetch('/api/treasury/accounts')
        .then(response => response.json())
        .then(data => {
            const accountsBody = document.getElementById('accounts-table-body');
            accountsBody.innerHTML = '';
            data.accounts.forEach(account => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${account.account_name}</td>
                    <td>${account.account_number}</td>
                    <td>${account.currency}</td>
                    <td>$${parseFloat(account.balance).toFixed(2)}</td>
                `;
                accountsBody.appendChild(row);
            });
        });
});
</script>
{% endblock %}
