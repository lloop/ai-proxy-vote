{% extends "base.html" %}

{% block title %}Community Chat{% endblock %}
{% block breadcrumb %}Chat{% endblock %}

{% block content %}
<div class="page-head">
    <div>
        <h1>Community Chat</h1>
        <p class="subtitle">Open discussion space for general members and organizers.</p>
    </div>
    <!-- <div>
        <label for="userSelect" style="font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px;">Acting User:</label>
        <select id="userSelect" onchange="updateActiveUser()" style="width: 200px;">
            <option value="1">organizer_alex (Organizer)</option>
            <option value="2">member_sam (General)</option>
        </select>
    </div> -->
</div>

<div class="card" style="display: flex; flex-direction: column; height: 600px;">
    <!-- Chat Message Feed -->
    <div id="chatMessages" style="flex-grow: 1; overflow-y: auto; padding-right: 8px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px;">
        <div class="empty">Loading messages...</div>
    </div>

    <!-- Message Input Form -->
    <div style="display: flex; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px;">
        <input type="text" id="chatInput" placeholder="Type a message to the community..." onkeydown="handleKeyPress(event)" style="flex-grow: 1;">
        <button class="button primary" onclick="sendChatMessage()">Send Message</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
