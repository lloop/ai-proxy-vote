<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Sound System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
        }
        .flashes {
            background-color: var(--red-soft);
            color: var(--red);
            padding: 10px 14px;
            border-radius: 9px;
            margin-bottom: 16px;
            font-size: 13px;
            list-style: none;
            padding-left: 14px;
        }
        .auth-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--muted);
        }
        .auth-footer a {
            color: var(--accent);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card auth-card">
        <div class="card-head" style="margin-bottom: 20px;">
            <div>
                <h1>Sign Up</h1>
                <p class="subtitle">Create your community account</p>
            </div>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="flashes">
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth_bp.signup') }}">
            <div class="form-grid">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                </div>

                <div class="field">
                    <label for="role">Role</label>
                    <select id="role" name="role">
                        <option value="general">General</option>
                        <option value="organizer">Organizer</option>
                    </select>
                </div>

                <button type="submit" class="button primary" style="width: 100%; margin-top: 4px;">Create Account</button>
            </div>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('auth_bp.login') }}">Log in</a>
        </div>
    </div>
</body>
</html>
